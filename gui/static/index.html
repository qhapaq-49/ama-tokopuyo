<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>とこぷよAI</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P88CKNEL7Q"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-P88CKNEL7Q');
  </script>
</head>
<body>

<h1>とこぷよAI</h1>

<div class="controls-bar">
  <label>シード: <input type="number" id="seed-input" value="42" min="0" max="16777215"></label>
  <button id="new-game-btn" class="primary">新しいゲーム</button>
  <label>
    <input type="checkbox" id="ai-toggle">
    AI評価モード
  </label>
</div>

<div class="game-area">

  <!-- FIELD -->
  <div class="field-wrap">
    <div id="field" tabindex="0"></div>
    <div id="chain-banner" class="chain-banner"></div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">

    <!-- Current piece + Next queue (combined) -->
    <div class="panel">
      <div class="piece-queue-row">
        <div class="piece-section">
          <div class="piece-label">現在のツモ</div>
          <div id="piece-display"></div>
          <div id="ai-status" class="ai-status"></div>
        </div>
        <div class="queue-section">
          <div class="piece-label">NEXT</div>
          <div id="next-queue"></div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="panel controls-panel">
      <h3>操作</h3>

      <div class="rotate-row">
        <button id="rot-ccw-btn">↺ 左回転 (Z)</button>
        <button id="rot-cw-btn">↻ 右回転 (X)</button>
      </div>

      <div class="move-grid">
        <button id="left-btn">← (←)</button>
        <button id="drop-btn" class="drop-btn primary">落とす (↓)</button>
        <button id="right-btn">→ (→)</button>
      </div>
    </div>

    <!-- Ask AI -->
    <button id="ask-ai-btn" class="primary" style="width:100%">Ask AI (A)</button>
    <button id="play-ai-btn" style="width:100%">AI最善手を打つ (Shift+A)</button>

    <!-- Undo / Redo -->
    <div class="undo-row">
      <button id="undo-btn">Undo (Ctrl+Z)</button>
      <button id="redo-btn">Redo (Ctrl+Y)</button>
    </div>

    <!-- Stats -->
    <div class="panel">
      <div class="stats">
        <span>手数: <span id="move-count" class="val">0</span></span>
        <span>連鎖: <span id="chain-count" class="val">0</span></span>
        <span>おじゃま: <span id="garbage-count" class="val">0</span></span>
      </div>
    </div>

    <!-- Settings -->
    <details class="panel">
      <summary style="cursor:pointer;user-select:none"><h3 style="display:inline">設定</h3></summary>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">

        <label class="setting-row">
          <span>ビーム幅 <small>(精度・速度)</small></span>
          <div class="setting-control">
            <input type="range" id="beam-width" min="50" max="500" step="50" value="250">
            <span id="beam-width-val">250</span>
          </div>
        </label>

        <label class="setting-row">
          <span>探索深さ <small>(手数先読み)</small></span>
          <div class="setting-control">
            <input type="range" id="beam-depth" min="4" max="24" step="2" value="16">
            <span id="beam-depth-val">16</span>
          </div>
        </label>

        <label class="setting-row">
          <span>悪手しきい値 <small>(0=警告なし)</small></span>
          <div class="setting-control">
            <input type="range" id="bad-threshold" min="0" max="95" step="5" value="75">
            <span id="bad-threshold-val">75%</span>
          </div>
        </label>

        <!-- AIモードセレクタ: fast/freestyle/acはai::thinkからの緊急フォールバック用DFSであり、
             計算資源が十分なとこぷよ用途ではbuild一択のためUI自体を非表示。
             セカンド向けの着想で組むわけでもなく（ちぎりPTが低いだけ）ユーザーが選ぶ意味がない。
        <label class="setting-row">
          <span>AIモード</span>
          <div class="setting-control">
            <select id="ai-mode" ...>
              <option value="build">build</option>
              <option value="fast">fast</option>
              <option value="ac">ac</option>
              <option value="freestyle">freestyle</option>
            </select>
          </div>
        </label>
        -->

        <label class="setting-row">
          <span>発火手を除外 <small>(構築練習用)</small></span>
          <div class="setting-control">
            <input type="checkbox" id="no-fire-toggle" style="width:16px;height:16px;cursor:pointer">
          </div>
        </label>

      </div>
    </details>

  </div>
</div>

<!-- Mobile Controls (hidden on desktop) -->
<div class="mobile-controls">
  <div class="mobile-ctrl-row">
    <button class="mob-rot" onclick="document.getElementById('rot-ccw-btn').click()">↺</button>
    <button class="mob-move" onclick="document.getElementById('left-btn').click()">←</button>
    <button class="mob-drop primary" onclick="document.getElementById('drop-btn').click()">↓</button>
    <button class="mob-move" onclick="document.getElementById('right-btn').click()">→</button>
    <button class="mob-rot" onclick="document.getElementById('rot-cw-btn').click()">↻</button>
  </div>
  <div class="mobile-ctrl-row">
    <button onclick="document.getElementById('undo-btn').click()">Undo</button>
    <button onclick="document.getElementById('redo-btn').click()">Redo</button>
    <button class="primary" onclick="document.getElementById('ask-ai-btn').click()">Ask AI</button>
    <button onclick="document.getElementById('play-ai-btn').click()">AI最善手</button>
  </div>
</div>

<!-- AI Overlay -->
<div id="ai-overlay" class="overlay">
  <div class="modal">
    <h3>AI候補手</h3>
    <p style="font-size:0.8rem;color:#aaa">現在の局面に対するAIの推奨手 (上位5件)</p>
    <ul id="ai-candidates" class="candidate-list"></ul>
    <div class="modal-buttons">
      <button id="close-ai-btn">閉じる</button>
    </div>
  </div>
</div>

<!-- Bad Move Alert -->
<div id="bad-move-overlay" class="overlay">
  <div class="modal">
    <h3>⚠️ 悪い手です！</h3>
    <p id="bad-move-msg"></p>
    <p style="font-size:0.75rem;color:#888;margin-top:6px">キー: <kbd>Z</kbd> やり直す　／　<kbd>Enter</kbd> このまま続ける</p>
    <div class="modal-buttons">
      <button id="undo-alert-btn" class="danger">やり直す [Z]</button>
      <button id="continue-btn">このまま続ける [Enter]</button>
    </div>
  </div>
</div>

<script src="coi-serviceworker.js"></script>
<script src="game.js"></script>
</body>
</html>
